name: "🎵 CI: Orchestrator"
on:
  workflow_call:
    inputs:
      distros:
        description: "Space-separated distro list"
        required: true
        type: string
      whitelist:
        description: "Optional space-separated whitelist of app ids"
        required: false
        type: string
        default: ""
      lifecycles:
        description: "Lifecycle envelope for test-deploy discovery (comma/space-separated)."
        required: false
        type: string
        default: ""
      mode:
        description: "Deploy modes rows may be drawn from: 'auto' rotates every row over the modes its role offers; a subset of 'host compose swarm' keeps only the rows those modes can take."
        required: false
        type: string
        default: "auto"
      priority:
        description: "Optional space-separated app ids for the priority line: sorted to the head of the list and cut into chunks of their own, so every priority row is deployed before the first regular one starts. Priority rows skip the sweep rotation and run every combination they can take (each variant, each offered mode, Tor and clearnet)."
        required: false
        type: string
        default: ""
      sweep:
        description: "Sweep number driving the mode/tor rotation and the regular-line offset. Empty: the run number."
        required: false
        type: string
        default: ""
      resume_from_chunk:
        description: "⏭️ Skip every chunk below this index. Use to continue a sweep after fixing what broke it, instead of re-running the green chunks. Typed string, not number: a workflow_dispatch number input reaches the caller as a string, and handing that to a number-typed workflow_call input makes GitHub reject the job before it is created."
        required: false
        type: string
        default: "0"
      chunk_gate:
        description: "🛑 Stop the chunk chain at its first failed chunk. Off: keep deploying the remaining chunks."
        required: false
        type: boolean
        default: true
      filesystem:
        description: "🗄️ Space-separated filesystems the per-distro pick draws from (ext4, btrfs, zfs). Empty: all three."
        required: false
        type: string
        default: ""
      image_wait_attempts:
        description: "Polling attempts for waiting on prebuilt or mirrored images"
        required: false
        type: string
        default: "1980"
      image_wait_sleep_seconds:
        description: "Polling interval in seconds for waiting on prebuilt or mirrored images"
        required: false
        type: string
        default: "10"
      workspace:
        description: "Run the workspace test (dev-runtime image matrix). 'auto' runs it on a global scope only, 'true'/'false' force it."
        required: false
        type: string
        default: "auto"
      workspace_track:
        description: "Which workspace track each distro runs: 'rotate' splits them across compose and swarm and flips with the run number, 'compose'/'swarm' pin every distro."
        required: false
        type: string
        default: "rotate"
      instructions:
        description: "Run the instructions test (role README Production command). 'auto' runs it on a global scope only, 'true'/'false' force it."
        required: false
        type: string
        default: "auto"
      tor:
        description: "Tor axis of the deploy matrix: 'auto' rotates the onion over the tor-capable rows, 'enforced' onions all of them, 'exclusive' also drops the rows that cannot, 'disabled' onions none."
        required: false
        type: string
        default: "auto"
      trusted_pr:
        description: "True when the PR carries the maintainer '🛡️ Trusted' label; skips the fork-prereq wait."
        required: false
        type: boolean
        default: false
      force_cancel_in_progress:
        description: "When true, a new run always cancels the running orchestrator on the same ref, ignoring the CI_CANCEL_IN_PROGRESS repository variable."
        required: false
        type: boolean
        default: false

concurrency:
  group: infinito-test-${{ github.ref }}
  cancel-in-progress: ${{ inputs.force_cancel_in_progress || vars.CI_CANCEL_IN_PROGRESS != 'false' }}

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  wait-fork-prereq-run:
    name: ⏳ Wait for fork run
    runs-on: ubuntu-latest
    env:
      WAIT_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !inputs.trusted_pr }}
    steps:
      - name: 🏷️ Mark fork prerequisites as ready outside fork PRs or for trusted PRs
        if: ${{ env.WAIT_REQUIRED != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Fork prerequisites are implicitly ready (non-fork PR or '🛡️ Trusted' label)."

      - name: ⬇️ Checkout trusted workflow repo (helpers)
        if: ${{ env.WAIT_REQUIRED == 'true' }}
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: 🔑 Login to GHCR for CI image checks
        if: ${{ env.WAIT_REQUIRED == 'true' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⏳ Wait for privileged fork CI images
        if: ${{ env.WAIT_REQUIRED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: entry-pr-change-orchestrate.yml
          TARGET_EVENT: pull_request_target
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          INFINITO_DISTROS: "arch debian ubuntu fedora centos"
          IMAGE_TAG: ci-${{ github.sha }}
          WAIT_ATTEMPTS: ${{ inputs.image_wait_attempts }}
          WAIT_SLEEP_SECONDS: ${{ inputs.image_wait_sleep_seconds }}
        run: ./scripts/meta/wait/images.sh

  fork-prereqs-ready:
    name: 🚦 Gate Dependencies
    needs: wait-fork-prereq-run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: ✅ Assert privileged prerequisites are ready
        shell: bash
        env:
          RESULT: ${{ needs.wait-fork-prereq-run.result }}
        run: ./scripts/github/gate/fork_prereqs.sh

  security-codeql:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/cron-security-codeql.yml

  lint:
    uses: ./.github/workflows/call-lint.yml

  test:
    uses: ./.github/workflows/call-test.yml

  build-ci-images:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/call-images-build-ci.yml
    with:
      distros: "arch debian ubuntu fedora centos"
      concurrency_channel: ci-orchestrator-build-consumer
    secrets: inherit

  test-dns:
    needs:
      - build-ci-images
      - fork-prereqs-ready
    uses: ./.github/workflows/call-test-dns.yml
    with:
      distros: "arch debian ubuntu fedora centos"

  images-mirror-missing:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/call-images-mirror-missing.yml
    with:
      concurrency_channel: ci-orchestrator-mirror-consumer
      image_wait_attempts: ${{ inputs.image_wait_attempts }}
      image_wait_sleep_seconds: ${{ inputs.image_wait_sleep_seconds }}
    secrets: inherit

  test-deploy-chunk-0:
    name: 🧱 Chunk 0
    if: >-
      ${{ always()
          && inputs.resume_from_chunk <= 0
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.build-ci-images.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && needs.test-dns.result == 'success' }}
    needs:
      - lint
      - test
      - build-ci-images
      - images-mirror-missing
      - test-dns
      - fork-prereqs-ready
    uses: ./.github/workflows/call-test-deploy.yml
    with:
      distros: ${{ inputs.distros }}
      index: "0"
      sweep: ${{ inputs.sweep != '' && inputs.sweep || github.run_number }}
      whitelist: ${{ inputs.whitelist }}
      priority: ${{ inputs.priority }}
      lifecycles: ${{ inputs.lifecycles }}
      modes: ${{ inputs.mode }}
      filesystem: ${{ inputs.filesystem }}
      tor: ${{ inputs.tor }}

  test-deploy-chunk-1:
    name: 🧱 Chunk 1
    if: >-
      ${{ always()
          && inputs.resume_from_chunk <= 1
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.build-ci-images.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && needs.test-dns.result == 'success'
          && (!inputs.chunk_gate
              || contains(fromJSON('["success","skipped"]'), needs.test-deploy-chunk-0.result)) }}
    needs:
      - lint
      - test
      - build-ci-images
      - images-mirror-missing
      - test-dns
      - test-deploy-chunk-0
    uses: ./.github/workflows/call-test-deploy.yml
    with:
      distros: ${{ inputs.distros }}
      index: "1"
      sweep: ${{ inputs.sweep != '' && inputs.sweep || github.run_number }}
      whitelist: ${{ inputs.whitelist }}
      priority: ${{ inputs.priority }}
      lifecycles: ${{ inputs.lifecycles }}
      modes: ${{ inputs.mode }}
      filesystem: ${{ inputs.filesystem }}
      tor: ${{ inputs.tor }}

  test-deploy-chunk-2:
    name: 🧱 Chunk 2
    if: >-
      ${{ always()
          && inputs.resume_from_chunk <= 2
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.build-ci-images.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && needs.test-dns.result == 'success'
          && (!inputs.chunk_gate
              || contains(fromJSON('["success","skipped"]'), needs.test-deploy-chunk-1.result)) }}
    needs:
      - lint
      - test
      - build-ci-images
      - images-mirror-missing
      - test-dns
      - test-deploy-chunk-1
    uses: ./.github/workflows/call-test-deploy.yml
    with:
      distros: ${{ inputs.distros }}
      index: "2"
      sweep: ${{ inputs.sweep != '' && inputs.sweep || github.run_number }}
      whitelist: ${{ inputs.whitelist }}
      priority: ${{ inputs.priority }}
      lifecycles: ${{ inputs.lifecycles }}
      modes: ${{ inputs.mode }}
      filesystem: ${{ inputs.filesystem }}
      tor: ${{ inputs.tor }}

  test-runner-smoke:
    needs:
      - test-deploy-chunk-0
    if: ${{ always() && vars.CI_SELF_HOSTED_RUNNER_COUNT != '0' && vars.CI_SELF_HOSTED_RUNNER_COUNT != '' && (needs.test-deploy-chunk-0.result == 'success' || needs.test-deploy-chunk-0.result == 'failure') }}
    uses: ./.github/workflows/call-test-runner-smoke.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  test-install-make:
    uses: ./.github/workflows/call-test-install-make.yml
  test-install-pkgmgr:
    uses: ./.github/workflows/call-test-install-pkgmgr.yml

  test-workspace:
    if: ${{ inputs.workspace == 'true' || (inputs.workspace == 'auto' && (inputs.whitelist == '' || inputs.whitelist == '__ALL__')) }}
    uses: ./.github/workflows/call-test-workspace.yml
    with:
      workspace_track: ${{ inputs.workspace_track }}
    needs:
      - images-mirror-missing
      - lint
      - test
    secrets: inherit

  test-instructions:
    if: ${{ inputs.instructions == 'true' || (inputs.instructions == 'auto' && (inputs.whitelist == '' || inputs.whitelist == '__ALL__')) }}
    uses: ./.github/workflows/call-test-instructions.yml
    needs:
      - images-mirror-missing
      - build-ci-images
      - lint
      - test
      - fork-prereqs-ready
    with:
      distros: ${{ inputs.distros }}
    secrets: inherit

  report-main-failures:
    name: 🐞 Report main role failures
    needs:
      - test-deploy-chunk-0
      - test-deploy-chunk-1
      - test-deploy-chunk-2
    if: ${{ always() && github.ref == 'refs/heads/main' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: 🐞 Open or append issues for failed roles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m cli.meta.ci.report_failures --run-id "${{ github.run_id }}" --repo "${{ github.repository }}"

  done:
    name: 🏁 Finish pipeline
    needs:
      - wait-fork-prereq-run
      - fork-prereqs-ready
      - build-ci-images
      - images-mirror-missing
      - test-dns
      - test-install-make
      - test-install-pkgmgr
      - test-deploy-chunk-0
      - test-deploy-chunk-1
      - test-deploy-chunk-2
      - test-runner-smoke
      - test-workspace
      - test-instructions
      - test
      - lint
      - security-codeql
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Fail if any upstream job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Pipeline failed: at least one upstream job failed or was cancelled." >&2
          exit 1
      - name: ✅ Done
        run: echo "All checks passed."
