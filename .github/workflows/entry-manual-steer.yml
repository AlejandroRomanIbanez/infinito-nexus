name: "🕹️ Manual"
run-name: "🕹️ ${{ inputs.chunk_gate && '🛑 ' || '' }}${{ inputs.resume_from_chunk != 0 && format('⏭️{0} ', inputs.resume_from_chunk) || '' }}${{ inputs.workspace != 'auto' && format('🧑‍💻{0} ', inputs.workspace == 'true' && '是' || '否') || '' }}${{ inputs.instructions != 'auto' && format('📖{0} ', inputs.instructions == 'true' && '是' || '否') || '' }}${{ inputs.tor != 'auto' && format('{0} ', inputs.tor == 'disabled' && '🌐' || inputs.tor == 'enforced' && '🧅强制' || '🧅独占') || '' }}${{ inputs.filesystem != '' && format('🗄️{0} ', inputs.filesystem) || '' }}${{ inputs.distros != '' && format('🐧{0} ', inputs.distros) || '' }}${{ inputs.lifecycles != '' && format('♻️{0} ', inputs.lifecycles) || '' }}${{ inputs.mode != 'auto' && format('🚀{0} ', inputs.mode) || '' }}${{ inputs.priority != '' && format('⭐{0} ', inputs.priority) || '' }}${{ inputs.whitelist != '' && format('🎯{0}', inputs.whitelist) || '🔀 diff (origin/main)' }}"

concurrency:
  group: global-ci-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      distros:
        description: "🐧 Distros to sweep. Empty: one at random. Example: 'arch debian'"
        required: false
        default: ""
        type: string
      priority:
        description: "⭐ Roles to deploy first, in every combination left open (each variant × each offered mode × Tor and clearnet). Pin axes to narrow it: 'web-app-x#0,2@swarm+tor', or paste a job label back ('🚀🧅网络应用·Nextcloud#2'). They get chunks of their own; the regular rows wait until those are green."
        required: false
        default: ""
        type: string
      whitelist:
        description: "🎯 Roles to deploy, in their normal matrix position. Same token syntax as ⭐, but what a token leaves open stays on the sweep rotation instead of being covered in full. Empty: diff vs origin/main. '__ALL__': every role."
        required: false
        default: ""
        type: string
      lifecycles:
        description: "♻️ Lifecycle envelope for test-deploy discovery (comma/space-separated)."
        required: false
        default: ""
        type: string
      mode:
        description: "🚀 Deploy mode. 'auto' rotates every row over the modes its role offers; a single mode keeps only the rows that mode can take."
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "host"
          - "compose"
          - "swarm"
      filesystem:
        description: "🗄️ Space-separated filesystems the per-distro pick draws from (ext4, btrfs, zfs). Empty: all three."
        required: false
        default: ""
        type: string
      tor:
        description: "🧅 Tor axis for swarm and compose. 'auto' onions every second tor-capable variant and flips with the run number, so two runs cover both states everywhere. 'enforced' onions every variant that can take one. 'exclusive' drops every variant that cannot, so the run tests the onion and nothing else. 'disabled' onions none. A variant pinning services.tor.enabled false is never eligible."
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "enforced"
          - "exclusive"
          - "disabled"
      resume_from_chunk:
        description: "⏭️ Skip every chunk below this index. Use to continue a sweep after fixing what broke it, instead of re-running the green chunks."
        required: false
        default: "0"
        type: string
      chunk_gate:
        description: "🛑 Stop the chunk chain at its first failed chunk. Off: keep deploying the remaining chunks."
        required: false
        default: true
        type: boolean
      sweep:
        description: "🔁 Sweep number driving the mode/tor rotation and the regular-line offset. Empty: the run number."
        required: false
        default: ""
        type: string
      workspace:
        description: "🧑‍💻 Run the workspace test (dev-runtime image matrix). 'auto' runs it on a global scope only."
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "true"
          - "false"
      workspace_track:
        description: "🧑‍💻 Which workspace track each distro runs. 'rotate' splits them across compose and swarm and flips with the run number, so two runs cover both everywhere."
        required: false
        default: "rotate"
        type: choice
        options:
          - "rotate"
          - "compose"
          - "swarm"
      instructions:
        description: "📖 Run the instructions test (role README Production command). 'auto' runs it on a global scope only."
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  pick-distro:
    name: 🎲 Pick distro(s)
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.pick.outputs.distros }}
    steps:
      - uses: actions/checkout@v7.0.0

      - id: pick
        shell: bash
        env:
          INPUT_DISTROS: ${{ inputs.distros }}
        run: ./scripts/github/resolve/manual_distros.sh

  ci-orchestrator:
    name: 🎛️ Orchestrate CI (manual)
    needs: pick-distro
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
      issues: write
    uses: ./.github/workflows/call-orchestrator.yml
    with:
      distros: ${{ needs.pick-distro.outputs.distros }}
      whitelist: ${{ inputs.whitelist }}
      lifecycles: ${{ inputs.lifecycles }}
      mode: ${{ inputs.mode }}
      priority: ${{ inputs.priority }}
      sweep: ${{ inputs.sweep }}
      resume_from_chunk: ${{ inputs.resume_from_chunk }}
      chunk_gate: ${{ inputs.chunk_gate }}
      filesystem: ${{ inputs.filesystem }}
      workspace: ${{ inputs.workspace }}
      workspace_track: ${{ inputs.workspace_track }}
      instructions: ${{ inputs.instructions }}
      tor: ${{ inputs.tor }}
      force_cancel_in_progress: true
    secrets: inherit
