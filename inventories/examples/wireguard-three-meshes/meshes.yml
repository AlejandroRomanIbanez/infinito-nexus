---
# Declarations for the three-mesh example. The mesh CLI is pointed at this file
# with --group-vars-file; the platform ships no meshes of its own.
#
# Only what belongs to this deployment is here. The range a spoke routes
# through its hub comes from NETWORK_MESH_POOL, which is declared once beside
# every other range the platform allocates.
WIREGUARD_MESHES:
  - name: alpha
    hub_group: svc-swarm-manager
    spoke_groups:
      - svc-swarm-node
    subnet: "10.100.10.0/24"
    listen_port: 51830
  - name: beta
    hub_group: svc-swarm-manager
    spoke_groups:
      - svc-storage-nfs-server
    subnet: "10.100.11.0/24"
    listen_port: 51831
  - name: gamma
    hub_group: svc-swarm-manager
    spoke_group_prefixes:
      - svc-bkp-
    subnet: "10.100.12.0/24"
    listen_port: 51832
