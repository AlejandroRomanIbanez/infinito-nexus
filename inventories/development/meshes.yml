---
# Mesh declarations for the swarm development lab. The platform ships no
# meshes of its own: a deployment declares the ones it wants and names this
# file, or its own, with --group-vars-file.
#
# The pool is not restated here. Declarations silent about it route
# NETWORK_MESH_POOL, which is where every range the platform allocates is
# declared once.
WIREGUARD_MESHES:
  - name: swarm
    hub_group: svc-swarm-manager
    spoke_groups:
      - svc-swarm-node
    subnet: "10.100.0.0/24"
    listen_port: 51820
  - name: data
    hub_group: svc-swarm-manager
    spoke_groups:
      - svc-storage-nfs-server
    spoke_group_prefixes:
      - svc-bkp-
    subnet: "10.100.1.0/24"
    listen_port: 51821
