---
credentials:
  ETCD_ROOT_PASSWORD:
    description: Password of the etcd 'root' user that administers users, roles and authentication
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  ETCD_PATRONI_PASSWORD:
    description: Password of the etcd user Patroni uses, restricted to the /service/ prefix
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  ETCD_MARIADB_ELECTOR_PASSWORD:
    description: Password of the etcd user the MariaDB writer elector uses, restricted to the /infinito/mariadb/ prefix
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  ETCD_OPENLDAP_ELECTOR_PASSWORD:
    description: Password of the etcd user the OpenLDAP writer elector uses, restricted to the /infinito/openldap/ prefix
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
