---
# Param: handover_primary - Redis instance that is master before the roll
- name: "🔀 Redis | SENTINEL FAILOVER away from {{ handover_primary }}"
  ansible.builtin.shell: |
    set -eu
    container exec "$({{ BIN_RESOLVE_CONTAINER_ID | quote }} {{ entity_name | quote }} {{ (entity_name ~ '-sentinel-' ~ _handover_host_id) | quote }})" sh -c 'REDISCLI_AUTH=$(cat "$SENTINEL_PASSWORD_FILE") exec redis-cli -p "$SENTINEL_PORT" SENTINEL FAILOVER "$SENTINEL_MASTER_NAME"'
  vars:
    _handover_host_id: "{{ (REDIS_HA.instances | selectattr('service', 'equalto', handover_primary) | first).host_id }}"
  register: _redis_handover_failover
  until: _redis_handover_failover.rc == 0 and (_redis_handover_failover.stdout | trim) == 'OK'
  retries: 15
  delay: 2
  delegate_to: "{{ DB_HA_ROLL_PRIMARY_NODE }}"
  run_once: true
  changed_when: true

- name: "⏳ Redis | Wait until Sentinel names a master other than {{ handover_primary }}"
  ansible.builtin.shell: |
    set -eu
    container exec "$({{ BIN_RESOLVE_CONTAINER_ID | quote }} {{ entity_name | quote }} {{ (entity_name ~ '-sentinel-' ~ _handover_host_id) | quote }})" sh -c 'REDISCLI_AUTH=$(cat "$SENTINEL_PASSWORD_FILE") exec redis-cli -p "$SENTINEL_PORT" SENTINEL get-master-addr-by-name "$SENTINEL_MASTER_NAME"' | head -1 | awk -F. '!/^[0-9.]+$/ && !/:/ { print $1 }'
  vars:
    _handover_host_id: "{{ (REDIS_HA.instances | selectattr('service', 'equalto', handover_primary) | first).host_id }}"
  register: _redis_handover_master
  until: >-
    _redis_handover_master.rc == 0
    and (_redis_handover_master.stdout | trim) | length > 0
    and (_redis_handover_master.stdout | trim) != handover_primary
  retries: 30
  delay: 2
  changed_when: false
  delegate_to: "{{ DB_HA_ROLL_PRIMARY_NODE }}"
  run_once: true
