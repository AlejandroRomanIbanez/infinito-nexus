---
- name: "✅ Egress router | Assert a clearnet resolver is configured"
  ansible.builtin.assert:
    that: networks.internet.dns | length > 0
    fail_msg: >-
      networks.internet.dns must be set on a Tor node: dnsmasq runs with
      no-resolv and would answer .onion only.
- name: "📦 Egress router | Install dnsmasq (host split-DNS forwarder)"
  become: true
  package_install:
    id: dnsmasq
- name: "📁 Egress router | Ensure the dnsmasq drop-in directory exists"
  ansible.builtin.file:
    path: "{{ TOR_DNSMASQ_CONF | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "🔧 Egress router | Ensure dnsmasq reads the drop-in directory"
  ansible.builtin.lineinfile:
    path: /etc/dnsmasq.conf
    regexp: "^conf-dir="
    line: "conf-dir={{ TOR_DNSMASQ_CONF | dirname }}/,*.conf"
    create: true
    owner: root
    group: root
    mode: "0644"
  register: _tor_dnsmasq_confdir
- name: "🔎 Egress router | Detect foreign dnsmasq drop-ins (shared instance)"
  ansible.builtin.find:
    paths: "{{ TOR_DNSMASQ_CONF | dirname }}"
    patterns: "*.conf"
    excludes: "{{ TOR_DNSMASQ_CONF | basename }}"
  register: _tor_dnsmasq_foreign
- name: "🔧 Egress router | Decide whether this dnsmasq is ours to reshape"
  ansible.builtin.set_fact:
    TOR_DNSMASQ_OWNS_LISTENER: "{{ _tor_dnsmasq_foreign.matched == 0 }}"

- name: "📝 Egress router | Render dnsmasq .onion split-DNS drop-in"
  ansible.builtin.template: # nocheck: stack-host-template (per-host dnsmasq system config in /etc/dnsmasq.d)
    src: dnsmasq-tor-onion.conf.j2
    dest: "{{ TOR_DNSMASQ_CONF }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    TOR_DNS_UPSTREAMS: "{{ [ networks.internet.dns ] }}"
  register: _tor_dnsmasq_conf
- name: "🔁 Egress router | Retry dnsmasq until docker0 exists after a boot"
  when: TOR_DNSMASQ_OWNS_LISTENER | bool
  block:
    - name: "📁 Egress router | Ensure the dnsmasq unit drop-in directory exists"
      ansible.builtin.file:
        path: "{{ TOR_DNSMASQ_DROPIN | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: "📝 Egress router | Restart dnsmasq on failure"
      ansible.builtin.copy:
        src: dnsmasq-restart.conf
        dest: "{{ TOR_DNSMASQ_DROPIN }}"
        owner: root
        group: root
        mode: "0644"
      register: _tor_dnsmasq_dropin
- name: "🚀 Egress router | Enable + (re)start dnsmasq"
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    daemon_reload: "{{ _tor_dnsmasq_dropin is changed }}"
    state: "{{ 'restarted' if (_tor_dnsmasq_conf is changed or _tor_dnsmasq_confdir is changed) else 'started' }}"
- name: "🔀 Egress router | Route host name resolution through dnsmasq"
  when: TOR_DNSMASQ_OWNS_LISTENER | bool
  block:
    - name: "🔀 Egress router | Point the host resolver at dnsmasq (127.0.0.1)"
      ansible.builtin.template: # nocheck: stack-host-template (per-host resolver config in /etc/resolv.conf)
        src: resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        unsafe_writes: true
    - name: "🔀 Egress router | Let a name systemd-resolved refuses reach dnsmasq"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: "^(hosts:.*\\bresolve)\\s*\\[!UNAVAIL=return\\](.*)$"
        line: "\\1 [SUCCESS=return NOTFOUND=continue TRYAGAIN=return]\\2"
        backrefs: true
- name: "🔀 Egress router | Redirect .onion virtual-IP TCP to Tor TransPort"
  ansible.builtin.iptables:
    table: nat
    chain: OUTPUT
    protocol: tcp
    destination: "{{ TOR_EGRESS_VIRTUAL_NET_IPV4 }}"
    jump: REDIRECT
    to_ports: "{{ TOR_TRANS_PORT | string }}"
    comment: "Tor egress router: .onion virtual range -> TransPort"

- name: "🔀 Egress router | Send container .onion traffic to the bridge TransPort"
  when: TOR_CONTAINER_DNS_HOST | length > 0
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination: "{{ TOR_EGRESS_VIRTUAL_NET_IPV4 }}"
    jump: DNAT
    to_destination: "{{ TOR_CONTAINER_DNS_HOST }}:{{ TOR_TRANS_PORT }}"
    comment: "Tor egress router: container .onion virtual range -> TransPort"

- name: "🔀 Egress router | Prove the container redirect is installed"
  when: TOR_CONTAINER_DNS_HOST | length > 0
  ansible.builtin.command:
    argv:
      - iptables
      - -t
      - nat
      - -C
      - PREROUTING
      - -p
      - tcp
      - -d
      - "{{ TOR_EGRESS_VIRTUAL_NET_IPV4 }}"
      - -j
      - DNAT
      - --to-destination
      - "{{ TOR_CONTAINER_DNS_HOST }}:{{ TOR_TRANS_PORT }}"
  changed_when: false

- name: "🛡️ Egress guard | Stage the guard applier"
  when: DEPLOYMENT_MODE == 'swarm'
  ansible.builtin.template:
    src: tor-egress-guard.sh.j2
    dest: "{{ TOR_EGRESS_GUARD_SCRIPT }}"
    owner: root
    group: root
    mode: "0750"
  notify: apply tor egress guard

- name: "🛡️ Egress guard | Install the unit that reapplies it after docker"
  when: DEPLOYMENT_MODE == 'swarm'
  ansible.builtin.template:
    src: tor-egress-guard.service.j2
    dest: "{{ TOR_EGRESS_GUARD_UNIT }}"
    owner: root
    group: root
    mode: "0644"
  notify: apply tor egress guard

- name: "🛡️ Egress guard | Enable the guard across reboots"
  when: DEPLOYMENT_MODE == 'swarm'
  ansible.builtin.systemd_service:
    name: "{{ TOR_EGRESS_GUARD_UNIT | basename }}"
    enabled: true
    state: started
    daemon_reload: true

- name: "🛡️ Egress guard | Flush handlers so the guard is live before checking"
  when: DEPLOYMENT_MODE == 'swarm'
  ansible.builtin.meta: flush_handlers

- name: "🛡️ Egress guard | Prove the guard rejects everything it must"
  when: DEPLOYMENT_MODE == 'swarm'
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - "{{ TOR_EGRESS_GUARD_CHAIN }}"
      - -j
      - DROP
  changed_when: false

- name: "🛡️ Egress guard | Prove every guarded port reaches the guard"
  when: DEPLOYMENT_MODE == 'swarm'
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - "{{ item.0 }}"
      - -p
      - "{{ item.1.protocol }}"
      - --dport
      - "{{ item.1.port | string }}"
      - -j
      - "{{ TOR_EGRESS_GUARD_CHAIN }}"
  changed_when: false
  loop: "{{ TOR_EGRESS_GUARD_HOOK_CHAINS | product(TOR_EGRESS_GUARDED_PORTS) | list }}"
