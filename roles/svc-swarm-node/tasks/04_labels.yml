---
- name: "⬆️ Push node labels for every swarm member"
  ansible.builtin.command: >-
    docker node update
    --label-add {{ SWARM_NODE_LABEL_HOST_ID }}={{ item }}
    --label-add {{ SWARM_NODE_LABEL_STACK_HOST }}={{ 'true' if item == STACK_HOST else 'false' }}
    {% for k, v in hostvars[item].swarm_node_labels.items() %}
    --label-add {{ k }}={{ v }}
    {% endfor %}
    {{ hostvars[item].ansible_facts.hostname | default(item) }}
  loop: "{{ groups['svc-swarm-node'] }}"
  changed_when: true
