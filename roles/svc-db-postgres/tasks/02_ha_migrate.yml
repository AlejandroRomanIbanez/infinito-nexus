---
- name: "🚚 POSTGRES | Migrate the standalone service into the HA form"
  when: DB_HA_MIGRATING[application_id] | bool
  block:
    - name: "🔍 POSTGRES | Resolve the standalone container"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
      vars:
        resolve_service_key: "{{ entity_name }}"
        resolve_service_name: "{{ entity_name }}_{{ entity_name }}"
        resolve_output_prefix: POSTGRES_LEGACY
        resolve_compose_cid: "{{ POSTGRES_CONTAINER }}"

    - name: "👤 POSTGRES | Create the replication and rewind roles while still standalone"
      ansible.builtin.include_tasks: utils/psql_primary.yml
      vars:
        psql_template: ha_roles.sql.j2
        psql_database: postgres
        psql_node: "{{ POSTGRES_LEGACY_HOST_NODE }}"
        psql_cid: "{{ POSTGRES_LEGACY_LOCAL_CID }}"

    - name: "🛑 POSTGRES | Stop the standalone service so only Patroni opens the legacy volume"
      ansible.builtin.command:
        argv:
          - container
          - service
          - scale
          - --detach=false
          - "{{ entity_name }}_{{ entity_name }}=0"
      delegate_to: "{{ STACK_HOST }}"
      run_once: true
