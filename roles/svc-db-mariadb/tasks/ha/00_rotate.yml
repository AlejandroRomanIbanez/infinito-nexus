---
- name: "🔍 MariaDB HA | Read which running instances hold seeded data"
  ansible.builtin.shell: |
    {{ BIN_RESOLVE_CONTAINER_ID | quote }} {{ entity_name | quote }} {{ item.service | quote }} >/dev/null 2>&1
    if [ "$?" -eq 67 ]; then
      echo absent
      exit 0
    fi
    container exec "$({{ BIN_RESOLVE_CONTAINER_ID | quote }} {{ entity_name | quote }} {{ item.service | quote }})" sh -c 'if test -e {{ MARIADB_HA_READY_MARKER }}; then echo ready; else echo unready; fi'
  register: _mariadb_rotate_state
  until: (_mariadb_rotate_state.stdout | trim) in ['absent', 'ready', 'unready']
  retries: 12
  delay: 5
  changed_when: false
  delegate_to: "{{ item.host }}"
  loop: "{{ MARIADB_INSTANCES.instances }}"
  loop_control:
    label: "{{ item.service }}"

- name: "🔑 MariaDB HA | Write the inventory's passwords into every seeded instance"
  ansible.builtin.include_tasks: utils/rotate_apply.yml
  loop: "{{ _mariadb_rotate_state.results | selectattr('stdout', 'equalto', 'ready') | map(attribute='item') | list }}"
  loop_control:
    loop_var: mariadb_rotate_instance
    label: "{{ mariadb_rotate_instance.service }}"
