---
- name: "🔍 MariaDB HA | Find the running instances that hold seeded data"
  ansible.builtin.shell: |
    container exec "$({{ BIN_RESOLVE_CONTAINER_ID | quote }} {{ entity_name | quote }} {{ item.service | quote }})" test -e {{ MARIADB_HA_READY_MARKER | quote }}
  register: _mariadb_rotate_ready
  changed_when: false
  failed_when: false
  delegate_to: "{{ item.host }}"
  loop: "{{ MARIADB_INSTANCES.instances }}"
  loop_control:
    label: "{{ item.service }}"

- name: "🔑 MariaDB HA | Write the inventory's passwords into every seeded instance"
  ansible.builtin.include_tasks: utils/rotate_apply.yml
  loop: "{{ _mariadb_rotate_ready.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
  loop_control:
    loop_var: mariadb_rotate_instance
    label: "{{ mariadb_rotate_instance.service }}"
