---
- name: "🔍 MariaDB HA | Ask the running instances which one is the writer"
  ansible.builtin.command:
    argv:
      - "{{ [DIR_BIN, MARIADB_INSTANCES.ha.probe] | path_join }}"
      - "{{ entity_name }}"
      - "{{ item.service }}"
  register: _mariadb_rotate_probe
  changed_when: false
  failed_when: false
  delegate_to: "{{ item.host }}"
  loop: "{{ MARIADB_INSTANCES.instances }}"
  loop_control:
    label: "{{ item.service }}"

- name: "🔧 MariaDB HA | Remember the running writer"
  ansible.builtin.set_fact:
    _mariadb_rotate_writers: "{{ _mariadb_rotate_probe.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

- name: "🔑 MariaDB HA | Write the inventory's passwords into the running writer"
  ansible.builtin.include_tasks: utils/rotate_apply.yml
  vars:
    mariadb_rotate_writer: "{{ _mariadb_rotate_writers[0] }}"
  when: _mariadb_rotate_writers | length == 1
