---
sites:
  type: volume
  name: erpnext_sites
  nfs:
    uid: "1000"
    gid: "1000"
    mode: "0770"
  mounts:
    - service: erpnext-configurator
      target: &home_frappe_frappe_bench_sites_target /home/frappe/frappe-bench/sites
    - service: erpnext-backend
      target: *home_frappe_frappe_bench_sites_target
    - service: erpnext-websocket
      target: *home_frappe_frappe_bench_sites_target
    - service: erpnext-scheduler
      target: *home_frappe_frappe_bench_sites_target
    - service: erpnext-queue-short
      target: *home_frappe_frappe_bench_sites_target
    - service: erpnext-queue-long
      target: *home_frappe_frappe_bench_sites_target
    - service: erpnext-frontend
      target: *home_frappe_frappe_bench_sites_target
logs:
  type: volume
  name: erpnext_logs
  nfs:
    uid: "1000"
    gid: "1000"
    mode: "0770"
  mounts:
    - service: erpnext-configurator
      target: &home_frappe_frappe_bench_logs_target /home/frappe/frappe-bench/logs
    - service: erpnext-backend
      target: *home_frappe_frappe_bench_logs_target
    - service: erpnext-websocket
      target: *home_frappe_frappe_bench_logs_target
    - service: erpnext-scheduler
      target: *home_frappe_frappe_bench_logs_target
    - service: erpnext-queue-short
      target: *home_frappe_frappe_bench_logs_target
    - service: erpnext-queue-long
      target: *home_frappe_frappe_bench_logs_target
    - service: erpnext-frontend
      target: *home_frappe_frappe_bench_logs_target
