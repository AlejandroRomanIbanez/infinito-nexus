---
- name: 📦 Install ldapsm (PyPI)
  include_role:
    name: sys-pip-install
  vars:
    package_name: ldapsm
    global_install: true

- name: ✅ Ensure custom LDAP schemas via ldapsm
  command: >
    ldapsm
      -s {{ OPENLDAP_SERVER_URI }}
      -D '{{ OPENLDAP_BIND_DN }}'
      -W '{{ OPENLDAP_BIND_PW }}'
      -n {{ item.name }}
      {% for at in item.attribute_types %}
      -a "{{ at }}"
      {% endfor %}
      {% for oc in item.object_classes %}
      -c "{{ oc }}"
      {% endfor %}
  register: ldapsm_result
  changed_when: "'Created schema entry' in ldapsm_result.stdout"
  check_mode: false
  loop: "{{ OPENLDAP_SCHEMAS }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
