---
- name: 📦 Install automtu via pip (system-wide)
  include_role:
    name: sys-pip-install
  vars:
    package_name: "automtu==1.1.1"
    global_install: true

- name: ✅ Ensure 'ip' and 'ping' commands are available for automtu
  package_install:
    id:
      - iproute
      - iputils-ping

- name: 🔍 Detect safe Docker MTU
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - -m
      - automtu
      - --pmtu-target
      - "{{ SYS_SVC_DOCKER_AUTOMTU_TARGETS | join(',') }}"
      - --pmtu-policy
      - min
      - --print-mtu
      - effective
  register: automtu_mtu
  changed_when: false

- name: ✅ Assert automtu returned an integer MTU
  ansible.builtin.assert:
    that:
      - automtu_mtu.stdout is match('^[0-9]+$')
      - (automtu_mtu.stdout | int) >= 576
      - (automtu_mtu.stdout | int) <= 9000
    fail_msg: "automtu returned unexpected MTU output: '{{ automtu_mtu.stdout | default('') }}'"

- name: 🔍 Read the MTU the daemon already runs with
  ansible.builtin.slurp:
    src: "{{ SYS_SVC_DOCKER_DAEMON }}"
  register: sys_svc_container_daemon_current
  failed_when: false

- name: 🔧 Set docker daemon MTU fact
  ansible.builtin.set_fact:
    SYS_DOCKER_DAEMONM_MTU: >-
      {{ _current
         if (_current > 0 and (automtu_mtu.stdout | int) > _current - SYS_SVC_DOCKER_MTU_STICKY_MARGIN)
         else (automtu_mtu.stdout | int) }}
  vars:
    _current: >-
      {{ ((sys_svc_container_daemon_current.content | b64decode | from_json).get('mtu', 0) | int)
         if (sys_svc_container_daemon_current.content is defined) else 0 }}
  changed_when: false
