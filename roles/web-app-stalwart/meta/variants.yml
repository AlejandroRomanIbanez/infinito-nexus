---
# Matrix-deploy variant overrides for web-app-stalwart.
# See docs/contributing/artefact/files/role/variants.md for the file format.

# nocheck: sso-variant-tor — the onion is pinned OFF, and pinned rather than left dynamic. The
# blocker is plugins/lookup/tor_ports.py: it gates HiddenServicePort on the RAW services.yml
# `tor.enabled`, an unrendered Jinja string for every role, so the hidden service forwards no mail
# port and an onion-primary provider hands every consumer an `email.host` nothing answers on.
# (The transport half is done: msmtprc.conf.j2 dials a `.onion` target through Tor's SOCKS
# listener.) A second reason to pin rather than leave dynamic: an unrendered flag reads truthy to
# the domain-map injector while the role's own lookup still resolves clearnet, publishing onion
# vhost names nothing serves. Pinning it ON also skips 05_tls.yml (an onion vhost has no TLS), and
# with it sys-ctl-mtn-cert-deploy, whose `required_by: [web-app-stalwart]` then fails the deploy.
# web-app-mailu can pin it on only because it is never the active provider.

# Two variants pin every dynamic services.yml flag on then off, so the matrix
# exercises both the in-group_names and not-in-group_names branches (required by
# tests/integration/roles/meta/variants/test_coverage.py). For a single-round
# local deploy, pin one: `make compose-deploy apps=web-app-stalwart variant=0`.

- services:
    css:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    postgres:
      shared: true
    matomo:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    tor:
      enabled: false
- services:
    css:
      enabled: false
      shared: false
    dashboard:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false
    postgres:
      shared: false
    matomo:
      enabled: false
      shared: false
    # Exception: the migration imports over IMAP with per-account passwords, so it rides the
    # round where SSO is off — an OIDC directory replaces password auth entirely (06_oidc.yml).
    mailu:
      enabled: true # nocheck: variants-static-override
      shared: true # nocheck: variants-static-override
    sso:
      enabled: false
      shared: false
    prometheus:
      enabled: false
      shared: false
    tor:
      enabled: false
