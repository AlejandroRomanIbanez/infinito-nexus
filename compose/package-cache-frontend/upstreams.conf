proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Accept-Encoding   "";
proxy_buffering on;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_connect_timeout 30s;

resolver 127.0.0.11 ipv6=off valid=30s;

server {
	listen 80;
	server_name archive.ubuntu.com;
	location /ubuntu/ {
		rewrite ^/ubuntu/(.*)$ /repository/apt-ubuntu/$1 break;
		proxy_intercept_errors on;
		proxy_read_timeout 8s;
		error_page 502 503 504 = @apt_ubuntu_mirror;
		proxy_pass http://package-cache:8081;
	}
	location @apt_ubuntu_mirror {
		rewrite ^/repository/apt-ubuntu/(.*)$ /repository/apt-ubuntu-mirror/$1 break;
		proxy_pass http://package-cache:8081;
	}
}

server {
	listen 443 ssl;
	server_name argos-net.com;
	ssl_certificate     /etc/nginx/certs/argos-net.com.crt;
	ssl_certificate_key /etc/nginx/certs/argos-net.com.key;
	location / {
		proxy_read_timeout 1800s;
		proxy_pass http://package-cache:8081/repository/raw-argos-net/;
	}
}

